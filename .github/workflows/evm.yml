name: EVM V5

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Forge tests
        id: forge
        shell: bash
        run: |
          set +e
          forge test -vvv > forge.log 2>&1
          code=$?
          cat forge.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Upload Forge log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-log
          path: forge.log
          if-no-files-found: warn

name: Block Revenue V7

on:
  push:
    branches:
      - experiment/block-revenue-engine-v7
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m compileall -q borrower_hunter block_revenue tests
      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  foundry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Forge tests
        run: forge test -vvv
